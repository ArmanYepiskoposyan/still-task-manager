name: Verify Still

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: .browsers
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the verified npm version
        run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check types, lint, unit tests and production build
        run: npm run check
      - name: Install test browsers
        run: npm exec -- playwright install --with-deps chromium firefox webkit
      - name: Verify browser workflows
        run: npm run test:e2e
      - name: Verify static deployment at root and repository subpath
        run: npm run test:release
